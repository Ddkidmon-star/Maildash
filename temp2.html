    <div id="old_count" class="hidden">0</div>

    <script>
    // Save the dynamic path generated by PHP into a JS constant
    const BASE_URL = "/";

    // Audio Notification Configuration
    let wav = true;
    let audio = new Audio(BASE_URL + 'notification.mp3');

    // Toggle sound button logic
    $("#snd-toggle").on('click', function() {
        wav = !wav;
        // Update the speaker icon based on state
        $("#snd-img").attr("src", wav ? BASE_URL + "img/sound_on.png" : BASE_URL + "img/sound_off.png");
        // Change button color to provide visual feedback
        if(wav) {
            $(this).removeClass('bg-red-600 border-red-700 hover:bg-red-700').addClass('bg-gray-800 border-gray-700 hover:bg-gray-900');
        } else {
            $(this).removeClass('bg-gray-800 border-gray-700 hover:bg-gray-900').addClass('bg-red-600 border-red-700 hover:bg-red-700');
        }
    });

    // Live Polling Function - Fetches new SMS without reloading the page
    function check() {
        let n = Math.round(new Date().getTime() / 1000);
        $.ajax({
            url: BASE_URL + "get_sms_register.php?phone=447848445216",
            headers: { 'X-Alt-Data': n },
            timeout: 8000, // Optional timeout to prevent hanging requests
            success: function(data) {
                try {
                    // Safely parse JSON to prevent crashes
                    let json = (typeof data === 'object') ? data : $.parseJSON(data);
                    
                    let old_count = parseInt($('#old_count').text()) || 0;
                    let total_old = parseInt($('#total_').text()) || 0;
                    let new_found = false;

                    // Loop through the fetched messages backwards to append in chronological order
                    for (let i = json.length - 1; i >= 0; --i) {
                        if (parseInt(json[i].mesaje_id) > old_count) {
                            let res = json[i].data.split(" ");
                            let dt = res[0] + "T" + res[1] + "Z"; // Format for timeago.js
                            
                            // Append the new message to the top of the table
                            $("#msgs tbody").prepend(
                                `<tr class="bg-violet-50/60 transition-colors duration-1000">
                                    <td class="px-6 py-4 text-sm font-bold text-gray-900">${json[i].telefon}</td>
                                    <td class="px-6 py-4 text-sm text-gray-600 leading-relaxed font-medium">${json[i].mesaj}</td>
                                    <td class="px-6 py-4 text-xs font-bold text-gray-400 whitespace-nowrap text-right"><span id="dtt" datetime="${dt}">${dt}</span></td>
                                </tr>`
                            );
                            $("#old_count").text(json[i].mesaje_id);
                            new_found = true;
                        }
                    }
                    
                    // If a new message arrived, update count and play sound
                    if (new_found) {
                        $("#total_").text(total_old + 1);
                        if (wav) {
                            audio.play().catch(e => console.log("Audio auto-play blocked by browser:", e));
                        }
                        // Refresh timeago formatting
                        if (typeof timeago === 'function') {
                            timeago().render(document.querySelectorAll('#dtt'));
                        }
                    }
                } catch (error) {
                    console.error("JSON Parsing or DOM Error:", error);
                }
            },
            error: function(xhr, status, error) {
                console.error("Polling AJAX Error (get_sms_register.php):", status, error);
            }
        });
    }

    $(document).ready(function() {
        // Start the polling loop immediately: exactly every 10 seconds (10000 ms)
        // This runs independently of the initial table load.
        setInterval(check, 10000);

        // Initial secure load generating the table rows
        let n = Math.round(new Date().getTime() / 1000);
        let nn = 'MFRUMHM1SGRoSSwxNzg3ODYwMjg5LDAyZjAzMDgxY2U2Y2ZjODFjNjA4NTk5MjhmNDlhYzMxMTM3YzkyOTl8NDQ3ODQ4NDQ1MjE2';
        
        $.ajax({
            url: BASE_URL + "script_register.php?key=" + encodeURIComponent(nn) + "&phone=447848445216&alt_x=" + n,
            beforeSend: function() { 
                $("#Loading").show(); 
            },
            success: function(html) {
                $("#Loading").hide();
                $("#msgs tbody").html(html);
                if (typeof timeago === 'function') {
                    timeago().render(document.querySelectorAll('#dtt'));
                }
                
                // Extract the ID of the last message to prepare the polling logic
                let lastId = $("#msgs tbody").find('#old_count').first().text();
                if(lastId) {
                    $("#old_count").text(lastId); // Store it in the hidden div
                }
            },
            error: function(xhr, status, error) {
                $("#Loading").hide();
                console.error("Initial Load AJAX Error (script_register.php):", status, error);
            }
        });

        // Initialize Clipboard functionality
        var clipboard = new ClipboardJS('#btn-copy');
        clipboard.on('success', function() {
            $("#copy-success").removeClass('hidden');
            setTimeout(() => { $("#copy-success").addClass('hidden'); }, 2000);
        });
    });
    </script>
